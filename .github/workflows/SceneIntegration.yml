name: Scene integration

on:
  workflow_call:
    inputs:
      archimedlight_ref:
        description: ArchimedLight branch, tag, or commit to test
        type: string
        default: main
      run_benchmarks:
        description: Measure the existing scene-light performance comparison
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      archimedlight_ref:
        description: ArchimedLight branch, tag, or commit to test
        type: string
        default: main
      run_benchmarks:
        description: Measure the existing scene-light performance comparison
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  integration:
    name: Scene integration - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out ArchimedLight
        uses: actions/checkout@v7
        with:
          repository: VEZY/ArchimedLight.jl
          ref: ${{ inputs.archimedlight_ref }}
          path: .ci-deps/ArchimedLight
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - name: Record candidate commits
        run: |
          git rev-parse HEAD
          git -C .ci-deps/ArchimedLight rev-parse HEAD
      - name: Prepare integration environment
        shell: julia --project=test/integration --color=yes {0}
        run: |
          using Pkg
          Pkg.develop([
              PackageSpec(path=pwd()),
              PackageSpec(path=joinpath(pwd(), ".ci-deps", "ArchimedLight")),
          ])
          Pkg.add([
              PackageSpec(name="PlantGeom", version="0.20.0"),
              PackageSpec(name="PlantSimEngine", version="0.15.0"),
          ])
          Pkg.instantiate()
          using ArchimedLight, PlantBiophysics, PlantGeom, PlantMeteo, PlantSimEngine
          @assert pkgversion(PlantGeom) == v"0.20.0"
          @assert pkgversion(PlantSimEngine) == v"0.15.0"
          @assert realpath(dirname(dirname(pathof(PlantBiophysics)))) == realpath(pwd())
          @assert realpath(dirname(dirname(pathof(ArchimedLight)))) == realpath(joinpath(pwd(), ".ci-deps", "ArchimedLight"))
          for package in (PlantBiophysics, ArchimedLight, PlantGeom, PlantMeteo, PlantSimEngine)
              @info "Integration dependency" package=nameof(package) version=pkgversion(package) path=pathof(package)
          end
          Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)
      - name: Run scene integration
        env:
          PLANTBIOPHYSICS_RUN_SCENE_LIGHT_BENCHMARK: ${{ inputs.run_benchmarks }}
        run: julia --project=test/integration --color=yes --check-bounds=yes test/integration/runtests.jl
